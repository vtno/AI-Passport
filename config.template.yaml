# AI Passport default gateway config: third-party subscription models only.
# When extending a serving stack (mode A), the stack's own config is used and
# grok_addon.yaml is appended instead (see docker-compose.grok.yml).
#
# Rendered to /app/config.yaml by render_config.py at container start.

model_list:
  # Grok via SuperGrok OAuth (no XAI_API_KEY needed; token stored at
  # ~/.config/litellm/xai_oauth/auth.json inside the xai_oauth_data volume).
  # Login: docker compose exec litellm litellm xai-oauth login
  - model_name: grok-4.6
    litellm_params:
      model: xai/grok-4.6
      use_xai_oauth: true
      # default is high per xAI docs; reasoning_effort can be overridden per-request

  - model_name: grok-4.6-low
    litellm_params:
      model: xai/grok-4.6
      use_xai_oauth: true
      reasoning_effort: low

  - model_name: grok-4.6-medium
    litellm_params:
      model: xai/grok-4.6
      use_xai_oauth: true
      reasoning_effort: medium

  - model_name: grok-4.6-high
    litellm_params:
      model: xai/grok-4.6
      use_xai_oauth: true
      reasoning_effort: high

  - model_name: grok-4.6-xhigh
    litellm_params:
      model: xai/grok-4.6
      use_xai_oauth: true
      reasoning_effort: xhigh

  # Anthropic Messages passthrough for Claude Code (synthetic).
  # LiteLLM translates /v1/messages -> OpenAI chat + injects reasoning_effort.
  - model_name: grok-4.6-ant
    litellm_params:
      model: xai/grok-4.6
      use_xai_oauth: true
    model_info:
      supports_output_config: true
      supports_low_reasoning_effort: true
      supports_xhigh_reasoning_effort: true

  # Claude model class aliases (rendered by render_config.py from
  # CLAUDE_ALIAS_MODEL + friends; xai/grok-4.6 in this base config).
CLAUDE_ALIAS_DEPLOYMENTS

general_settings:
  coordination_redis:
    url: os.environ/REDIS_URL

litellm_settings:
  drop_params: true
  num_retries: 0
