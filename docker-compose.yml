# AI Passport standalone base (port 4001, own db/redis).
# Ships a working gateway with subscription models only (Grok today; more
# third-party providers later) - no serving stack required.
#   docker compose up -d
#   docker compose exec litellm litellm xai-oauth login
#
# To extend an existing serving stack instead (shared db, stack's port), use:
#   ./aipass <stack>/docker-compose.yml
# (uses docker-compose.grok.yml; additive - the stack's config/env stay the stack's)
name: litellm-private
services:
  litellm:
    image: ghcr.io/berriai/litellm@sha256:aded103a25605460bd6338fee6ba0bdbecfc548a27b59a1710f591c91671b47a
    container_name: litellm-private
    env_file:
      - .env
    # Claude-class models (claude-sonnet-*/haiku-*/…) route to Grok.
    environment:
      CLAUDE_ALIAS_MODEL: xai/grok-4.6
      CLAUDE_ALIAS_USE_OAUTH: "1"
    ports:
      - "4001:4000"
      - "127.0.0.1:56121:56121"  # xAI OAuth PKCE callback
    volumes:
      - ./config.template.yaml:/app/config.template.yaml:ro
      - ./render_config.py:/app/render_config.py:ro
      - xai_oauth_data:/root/.config/litellm/xai_oauth
    entrypoint: ["sh", "-c"]
    command:
      - "python3 /app/render_config.py && litellm --config /app/config.yaml --port 4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    depends_on:
      - db
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: litellm-private-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - default

  db:
    image: postgres:17.11
    container_name: litellm-private-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-pg
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  redisdata:
  xai_oauth_data:
